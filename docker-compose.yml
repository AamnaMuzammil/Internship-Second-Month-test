services:
  postgres:
    image: postgres:16
    container_name: salon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon123
      POSTGRES_DB: salon_db
    ports:
      - "5432:5432"
    volumes:
      - salon_pgdata:/var/lib/postgresql/data

volumes:
  salon_pgdata: